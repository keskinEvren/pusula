  <line x1="256" y1="392" x2="256" y2="416" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <line x1="96" y1="256" x2="120" y2="256" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <line x1="392" y1="256" x2="416" y2="256" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
